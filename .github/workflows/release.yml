name: release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require Apple Silicon runner
        run: test "$(uname -m)" = "arm64"
      - name: Install libwebp
        run: brew install webp
      - name: Build and convert fixture
        run: ./scripts/check.sh
      - name: Zip .app
        run: ditto -c -k --keepParent mac/dist/clipslim.app clipslim-macos-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: clipslim-macos-arm64.zip
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish
        shell: pwsh
        run: ./win/build.ps1
      - name: Require GUI subsystem
        shell: pwsh
        run: python scripts/check-gui-subsystem.py ./win/dist/clipslim.exe
      - name: Convert fixture
        shell: pwsh
        run: |
          $out = Join-Path $env:TEMP "out.webp"
          $p = Start-Process -FilePath ./win/dist/clipslim.exe -ArgumentList @('--convert', './fixtures/screenshot.png', $out) -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path $out)) { throw "convert failed (exit $($p.ExitCode))" }
          $bytes = [IO.File]::ReadAllBytes($out)
          $riff = [Text.Encoding]::ASCII.GetString($bytes[0..3])
          $tag = [Text.Encoding]::ASCII.GetString($bytes[8..11])
          if ($riff -ne "RIFF" -or $tag -ne "WEBP") { throw "not webp: $riff $tag" }
          $src = (Get-Item ./fixtures/screenshot.png).Length
          if ($bytes.Length -ge $src) { throw "not smaller: $($bytes.Length) >= $src" }
          Write-Host "ok webp $($bytes.Length) from $src"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: win/dist/clipslim.exe
          if-no-files-found: error

  publish:
    needs: [mac, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Pack assets
        run: |
          set -euo pipefail
          mkdir -p out
          cp dist/macos/clipslim-macos-arm64.zip out/
          cp dist/windows/clipslim.exe out/clipslim-windows-x64.exe
          cd out
          sha256sum clipslim-macos-arm64.zip clipslim-windows-x64.exe | tee checksums.txt
          ls -lh
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          MAC_SHA=$(cut -d' ' -f1 out/checksums.txt | sed -n '1p')
          WIN_SHA=$(cut -d' ' -f1 out/checksums.txt | sed -n '2p')
          cat > notes.md <<EOF
          Copy a screenshot. Paste a smaller file. Menu bar on Mac, tray on Windows. The image never leaves the machine.

          ## Downloads

          | Platform | File |
          |---|---|
          | macOS (Apple Silicon) | [clipslim-macos-arm64.zip](https://github.com/${{ github.repository }}/releases/download/${TAG}/clipslim-macos-arm64.zip) |
          | Windows (x64) | [clipslim-windows-x64.exe](https://github.com/${{ github.repository }}/releases/download/${TAG}/clipslim-windows-x64.exe) |

          macOS has an ad-hoc signature, not a Developer ID, and is not notarized. First launch is **right-click → Open**. Windows is unsigned: SmartScreen may warn. The Windows build is self-contained (.NET 8 bundled).

          ## SHA-256

          \`\`\`
          ${MAC_SHA}  clipslim-macos-arm64.zip
          ${WIN_SHA}  clipslim-windows-x64.exe
          \`\`\`
          EOF
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              out/clipslim-macos-arm64.zip \
              out/clipslim-windows-x64.exe \
              --repo "${{ github.repository }}" \
              --clobber
            gh release edit "$TAG" \
              --repo "${{ github.repository }}" \
              --notes-file notes.md
          else
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "$TAG" \
              --notes-file notes.md \
              --generate-notes \
              out/clipslim-macos-arm64.zip \
              out/clipslim-windows-x64.exe
          fi
